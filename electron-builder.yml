appId: com.aamir.pos
productName: POS
directories:
  output: release
files:
  - dist-main/**
  - dist-renderer/**
asarUnpack:
  - "node_modules/better-sqlite3/**"
  - "node_modules/sqlite-vec*/**"
  - "node_modules/bindings/**"
  - "node_modules/file-uri-to-path/**"
mac:
  target:
    - target: dir
      arch: [arm64]
  category: public.app-category.productivity
  identity: "POS Dev"  # stable self-signed identity so TCC grants survive rebuilds (2026-08-24)
  # TCC reads these from Info.plist at the moment it prompts. Electron ships generic
  # defaults ("This app needs access to the microphone"); override them so the prompts
  # name POS and say what the data is used for. Missing NSCalendars/NSAppleEvents keys
  # make the Calendar.app and Messages automation prompts fail outright.
  extendInfo:
    NSMicrophoneUsageDescription: >-
      POS transcribes your dictation locally with whisper.cpp; audio never leaves your Mac.
    NSCalendarsUsageDescription: >-
      POS reads and writes your calendar to plan your day.
    NSAppleEventsUsageDescription: >-
      POS uses Calendar.app and Messages to read events and send the messages you approve.
# Rebuild handled explicitly by `npm run rebuild:electron` (prebuild-install with the
# electron runtime) — electron-builder's own rebuild restores the wrong (node) prebuild.
npmRebuild: false
